[package]
name = "yadgar-lifecycle"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "How a server process starts, stops and restarts: ADR-0523's exit-on-change rotation watcher, the SIGTERM drain, and the budget that bounds it."

# ONE GATE, AND IT IS DRAWN WHERE THE COST IS.
#
# `rotate` is DEFAULT-ON, so every consumer that already pins this crate builds
# exactly what it built before and no manifest has to move to keep working.
# Turning it off is what a service opts into, and it drops the whole certificate
# tree — `x509-parser` over `asn1-rs`, `der-parser`, `oid-registry`, `nom` and
# the rest — plus `sha2`, `thiserror` and the `metrics` facade. MEASURED on the
# normal dependency graph with `cargo tree -e normal`, not estimated: 64 crates
# with the feature and 16 without it, so 48 go.
#
# RE-MEASURED 2026-09-05, when the configuration reader landed and brought serde
# and a YAML parser with it. It was 54/16/38 before that; leaving the old numbers
# in place would have made a measurement into a claim, which is the shape this
# repository keeps finding and deleting.
#
# NO CONSUMER TURNS IT OFF TODAY, and this sentence used to claim two did: it read
# "`iam-db` and `task-db` call `shutdown` and nothing else, and paid for all 38".
# That is false and was checked rather than reasoned about — both call
# `rotate::Schedule::from_env`, and `x509-parser` is in both of their `Cargo.lock`
# files. The gate is still worth its complexity for an adopter who wants only the
# drain, but nothing in this estate is the example.
#
# **THERE IS NO `drain` GATE, and that is a measurement rather than a taste.**
# `drain.rs` reaches for `tokio` and `tracing` and nothing else, and `rotate`
# needs both anyway — so gating it would drop ZERO crates while admitting a
# `default-features = false` build of a crate with no public items in it. All
# five consumers that pin this crate today use `shutdown`. A gate earns its
# complexity by removing weight, and that one would remove none.
[features]
default = ["rotate"]
rotate = [
  "dep:metrics",
  "dep:rustls-pki-types",
  "dep:serde",
  "dep:serde_norway",
  "dep:sha2",
  "dep:thiserror",
  "dep:x509-parser",
]
# THE LISTENER'S TRANSPORT, LIFTED ONCE (ADR-0846). Six gRPC servers held a
# near-identical `ServerTls` copy and none verified a client certificate; this is
# the one implementation they adopt, so a security control cannot drift six ways.
#
# OPT-IN, and that is the cost argument `rotate` already makes, in reverse. This
# feature pulls tonic's server and rustls; a consumer that only wants the drain
# or the watcher must not pay for a gRPC stack, which is the rule the
# `[dependencies]` comment below states. `rustls-pki-types` and `thiserror` are
# shared with `rotate`, so they are optional once and named by both.
serve-tls = ["dep:rustls-pki-types", "dep:thiserror", "dep:tonic"]

[dependencies]
# NO TRANSPORT, DELIBERATELY. `drain_within` is generic over a
# `tokio::task::JoinHandle`, so it bounds a tonic server, an axum server or a
# bare accept loop without naming any of them. A lifecycle crate that pulled in
# a gRPC stack would make every adopter pay for one.
#
# `tokio` and `tracing` are UNGATED because `drain` needs every one of these
# features on its own: `signal` and `macros` for `shutdown`'s `select!`, `sync`
# for the oneshot `drain_within` holds, `time` for the budget.
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
tracing = "0.1"
# EVERYTHING BELOW IS `rotate`-ONLY. Each is used in `src/rotate.rs` and nowhere
# else, which is what makes one gate over the module the whole of the split.
thiserror = { version = "2", optional = true }
sha2 = { version = "0.11", optional = true }
# PEM to DER and no further, which is all the watcher needs to fingerprint a
# leaf. The same parser tonic and rustls use, so "the first certificate in this
# file" means the same thing here as it does to the listener.
rustls-pki-types = { version = "1", features = ["std"], optional = true }
# For `validity().not_after` ALONE. `rustls-pki-types` decodes PEM to DER and
# stops there; nothing in the rustls tree will read an expiry out of the result.
x509-parser = { version = "0.18", optional = true }
# THE CONFIGURATION DOCUMENT, and the reason a YAML parser is here at all.
# ADR-0570 delivers a knob as a ConfigMap mounted as a FILE, and ADR-0569 gives
# that file exactly one source with no compiled-in default. So `Schedule` reads
# `shared.yaml` out of the mount, and reading it needs a parser.
#
# `serde_norway` RATHER THAN `serde_yaml`, which is the obvious choice and is
# unmaintained — RUSTSEC-2024-0370 — and `deny.toml` in this repository turns an
# advisory into a failing gate. `serde_norway` is the maintained fork of the same
# code, so the API is the one every Rust developer already knows.
#
# TYPED AND PARTIAL, never a free-form map. The struct below names only the knobs
# THIS crate reads and deliberately does NOT set `deny_unknown_fields`: the
# document is shared with knobs owned by other code, and a parser that refused an
# unknown key would make adding anybody else's setting break this one.
serde = { version = "1", features = ["derive"], optional = true }
serde_norway = { version = "0.9", optional = true }
# The metrics FACADE only, for the same reason `yadgar-telemetry` states: a
# library that installs an exporter decides the backend for every service that
# links it. The binary installs one.
metrics = { version = "0.24", optional = true }
# `serve-tls`-ONLY. `server` for `Server` and `ServerTlsConfig`; `tls-ring` for
# the crypto provider. NOT `transport`, which drags `channel` and a client stack
# no listener needs, and NOT the default features, which are `transport` again.
#
# **ONE PROVIDER, AND IT IS MEASURED RATHER THAN ASSUMED.** tonic's acceptor
# builds its config with `rustls::ServerConfig::builder()`, which reads the
# PROCESS-DEFAULT crypto provider and installs one from rustls's crate features.
# With both `ring` and `aws-lc-rs` compiled in there is no single default, and
# the first TLS listener panics at boot. `ring` is pinned because no adopter
# links the other one: `aws-lc-rs` appears in NONE of the six adopters'
# `Cargo.lock` files (`iam`, `iam-db`, `task`, `task-db`, `project`,
# `project-db`, `origin/main`, checked 2026-10-03), and the `-db` modules
# already link `ring` through sqlx `tls-rustls-ring`. That is a fact about
# those lock files today; an adopter that later pulls `aws-lc-rs` in would
# reintroduce the panic. MEASURED for this crate 2026-10-03, not reasoned about:
#
#   cargo tree -e normal --features serve-tls -i aws-lc-rs
#     error: package ID specification `aws-lc-rs` did not match any packages
#   cargo tree -e normal,build --all-features --target all -i aws-lc-rs
#     error: package ID specification `aws-lc-rs` did not match any packages
#   cargo tree -e normal --features serve-tls -i ring
#     ring v0.17.14 <- rustls v0.23.45 <- tokio-rustls v0.26.6 <- tonic v0.14.6
#   cargo tree -e normal -i tonic          (default features)
#     warning: nothing to print.
#
# So `aws-lc-rs` is not in the lock file at all, and a consumer that does not
# enable the feature builds no tonic.
tonic = { version = "0.14", default-features = false, features = [
  "server",
  "tls-ring",
], optional = true }

# THE TWO ROTATION SUITES NAME THE FEATURE THEY NEED, because a test target
# cannot be gated any other way: Cargo forbids an optional dev-dependency, so
# `--no-default-features` would still compile `tests/rotation.rs` against a
# module that is no longer there and fail on the `use`. `required-features`
# makes Cargo skip the target instead.
#
# `tests/drain.rs`, `tests/shutdown.rs` and `tests/arming.rs` stay
# auto-discovered — declaring some targets does not switch `autotests` off — and
# they must, because what they cover is exactly what survives the gate.
[[test]]
name = "rotation"
required-features = ["rotate"]

[[test]]
name = "assembly"
required-features = ["rotate"]

# The `serve-tls` suites, gated for the same reason. CI's `cargo test
# --all-features` is the run that reaches them; the feature-off run skips the
# targets rather than failing to compile them.
[[test]]
name = "serve_tls_config"
required-features = ["serve-tls"]

[[test]]
name = "serve_tls_handshake"
required-features = ["serve-tls"]

[[test]]
name = "serve_tls_watch"
required-features = ["serve-tls", "rotate"]

[dev-dependencies]
# `test-util` for a paused clock, `net` for the drain rig's real listener.
tokio = { version = "1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "test-util",
] }
# Certificates are MINTED PER RUN rather than checked in: a fixture key in the
# repository is a secret in the repository, and it expires on a date nobody is
# watching.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# `DebuggingRecorder` + `with_local_recorder`: the only way to assert that the
# metric NAME a dashboard queries and the value the gauge receives are what this
# crate claims. MUST resolve against `metrics 0.24` — a metrics-util built on
# another major links a SECOND facade, and then the snapshot is empty while
# every assertion still compiles and passes.
metrics-util = { version = "0.20", features = ["debugging"] }
# THE CLIENT HALF OF THE `serve-tls` HANDSHAKES. A listener's client-auth mode
# is only proved by a real client presenting (or withholding) a certificate, so
# the suites dial with tonic's own channel. `router` serves `Routes::default()`;
# `codegen` re-exports the `Service` trait the rig sends its one request with.
# Dev-only: Cargo unifies these into the TEST build, so `cargo check --lib
# --features serve-tls` is what proves the library builds on `server` alone.
tonic = { version = "0.14", default-features = false, features = [
  "channel",
  "codegen",
  "router",
  "server",
  "tls-ring",
] }
# `TcpListenerStream`: bind first, then serve, so no port is picked and reopened.
tokio-stream = { version = "0.1", features = ["net"] }
# Captures the warning a configured-but-unused client CA emits, synchronously,
# with `tracing::subscriber::with_default`.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
